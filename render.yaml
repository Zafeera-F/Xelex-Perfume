# Render Blueprint — documents the backend + Postgres setup as code so the
# dashboard configuration isn't tribal knowledge. Apply via Render's
# "New > Blueprint" flow pointed at this repo. Secrets (sync: false) are
# never stored here — Render prompts for them once at apply time and they
# live only in Render's own env var store from then on.
#
# buildCommand deliberately uses `prisma migrate deploy`, not the
# `prisma:migrate` npm script (which runs `prisma migrate dev` — dev-only,
# interactive, wrong for a non-interactive production deploy).

databases:
  - name: xelex-postgres
    plan: free
    databaseName: xelex
    user: xelex

services:
  - type: web
    name: xelex-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xelex-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      # Set to the real Vercel deployment URL once known (see the deploy
      # plan's runbook) — cookies won't flow correctly until this matches.
      - key: CORS_ORIGIN
        sync: false
      # Generate fresh values for both — never reuse local dev's secrets.
      # node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: ADMIN_JWT_SECRET
        sync: false
      # Bootstrap SUPER_ADMIN — only consumed by `npm run prisma:seed`,
      # run once manually after the first deploy (see runbook).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      # Optional — UPI payment routes 503 until these are set.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional — email/SMS features no-op until these are set.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_TEMPLATE_ORDER_PLACED
        sync: false
      - key: MSG91_TEMPLATE_ORDER_SHIPPED
        sync: false
      - key: MSG91_TEMPLATE_OUT_FOR_DELIVERY
        sync: false
      - key: MSG91_TEMPLATE_DELIVERED
        sync: false
      # Optional — Sentry stays inert until this is set.
      - key: SENTRY_DSN
        sync: false
